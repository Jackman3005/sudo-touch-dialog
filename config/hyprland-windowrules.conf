# Window rules for the sudo-touch-dialog GTK window.
# Source from your hyprland.conf:
#   source = ~/Work/sudo-touch-dialog/config/hyprland-windowrules.conf
#
# Mirrors the existing lxqt-openssh-askpass rules (float, center, pin,
# stay_focused, dim_around) but lets GTK size the window to its content
# so long commands wrap cleanly without being clipped.

windowrule = float on, match:class io.github.Jackman3005.SudoTouchDialog
windowrule = center on, match:class io.github.Jackman3005.SudoTouchDialog
windowrule = pin on, match:class io.github.Jackman3005.SudoTouchDialog
windowrule = stay_focused on, match:class io.github.Jackman3005.SudoTouchDialog
windowrule = dim_around on, match:class io.github.Jackman3005.SudoTouchDialog
